<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ravintola Menu - Editori</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="generate_preview.js"></script>
  <script src="generate_emenu.js"></script>

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    input[type=range] { accent-color: #3b82f6; }
    [v-cloak] { display: none; }
  </style>
</head>
<body class="bg-gray-900 text-gray-200 h-screen overflow-hidden text-sm select-none">

<div id="app" v-cloak class="flex flex-col-reverse md:flex-row h-full w-full">
  <input type="file" ref="fileInput" accept=".html" @change="importHtml" class="hidden">

  <!-- VASEN PANEELI: EDITOR -->
  <div class="w-full md:w-[500px] flex flex-col h-[75vh] md:h-full border-t md:border-t-0 md:border-r border-gray-700 bg-gray-800 shrink-0 shadow-2xl z-10 select-auto overflow-hidden">

    <div class="p-4 border-b border-gray-700 flex flex-col gap-3 bg-gray-900 shadow-md z-20">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <h1 class="text-base sm:text-lg font-bold text-white whitespace-nowrap"><i class="fa-solid fa-utensils mr-2 text-blue-400"></i> Menu Editori</h1>
        <div class="flex flex-wrap gap-2 justify-end w-full sm:w-auto">
          <button @click="clearMenu" class="bg-red-600 hover:bg-red-500 text-white px-2 py-1.5 rounded shadow transition text-xs font-bold uppercase" title="Tyhjennä ruokalista">
            <i class="fa-solid fa-trash"></i> <span class="hidden lg:inline ml-1">Tyhjennä</span>
          </button>
          <button @click="$refs.fileInput.click()" class="bg-gray-700 hover:bg-gray-600 text-white px-2 py-1.5 rounded shadow transition text-xs font-bold uppercase">
            <i class="fa-solid fa-upload mr-1"></i> Tuo
          </button>
          <button @click="exportHtml" class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1.5 rounded shadow transition text-xs font-bold uppercase">
            <i class="fa-solid fa-file-code mr-1"></i> Vie HTML
          </button>
        </div>
      </div>
    </div>

    <!-- Editorin sisältö -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">

      <!-- NAVIGOINTI TABS -->
      <div class="flex flex-col gap-2 mb-4 bg-gray-700 p-2 rounded shadow-inner">
        <div class="flex flex-wrap gap-1 justify-center sm:justify-start">
          <button @click="activeTab = 'header'" :class="tabClass('header')">Yläpalkki</button>
          <button @click="activeTab = 'footer'" :class="tabClass('footer')">Alapalkki</button>
          <button @click="activeTab = 'styles'" :class="tabClass('styles')"><i class="fa-solid fa-palette"></i> Tyylit</button>
        </div>
        <div class="flex flex-wrap gap-1 border-t border-gray-600 pt-2 justify-center sm:justify-start">
          <button v-for="(col, i) in state.columns" :key="'tab-col-'+i" @click="activeTab = 'col'+i" :class="tabClass('col'+i)">
            {{ col.title || ('Sar. ' + (i+1)) }}
          </button>
        </div>
      </div>

      <!-- TYYLIT -->
      <div v-if="activeTab === 'styles'" class="space-y-4 animate-fade-in">
        <div class="bg-gray-900 p-4 rounded border border-gray-700 space-y-4">
          <div>
            <label class="block text-gray-400 text-xs font-bold mb-1 uppercase">Otsikoiden Fontti</label>
            <select v-model="state.styles.fontHeading" class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 focus:outline-none">
              <option value="Playfair Display">Playfair Display</option>
              <option value="Merriweather">Merriweather</option>
              <option value="Montserrat">Montserrat</option>
              <option value="Oswald">Oswald</option>
              <option value="Roboto Slab">Roboto Slab</option>
              <option value="Lora">Lora</option>
              <option value="Cinzel">Cinzel</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-400 text-xs font-bold mb-1 uppercase">Tekstin Fontti</label>
            <select v-model="state.styles.fontBody" class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 focus:outline-none">
              <option value="Lato">Lato</option>
              <option value="Roboto">Roboto</option>
              <option value="Open Sans">Open Sans</option>
              <option value="Inter">Inter</option>
              <option value="Poppins">Poppins</option>
              <option value="Nunito">Nunito</option>
              <option value="Ubuntu">Ubuntu</option>
            </select>
          </div>
          <div class="pt-2 border-t border-gray-700">
            <label class="block text-gray-400 text-xs font-bold mb-2 uppercase flex justify-between mt-2">
              <span>Sisällön Koko (Ruokalista)</span>
              <span class="text-blue-400">{{ state.styles.fontSizeContent }}px</span>
            </label>
            <input type="range" v-model.number="state.styles.fontSizeContent" min="16" max="40" step="1" class="w-full cursor-pointer">
          </div>
          <div>
            <label class="block text-gray-400 text-xs font-bold mb-2 uppercase flex justify-between">
              <span>Palkkien Koko (Ylä/alaotsikot)</span>
              <span class="text-blue-400">{{ state.styles.fontSizeBars }}px</span>
            </label>
            <input type="range" v-model.number="state.styles.fontSizeBars" min="16" max="40" step="1" class="w-full cursor-pointer">
          </div>

          <!-- TAUSTAN ASETUKSET -->
          <div class="pt-2 border-t border-gray-700">
            <label class="block text-gray-400 text-xs font-bold mb-2 uppercase">Taustan Väri</label>
            <div class="flex gap-2 items-center">
              <input type="color" v-model="state.styles.bgColor" class="w-10 h-8 rounded cursor-pointer bg-gray-800 border border-gray-600">
              <input type="text" v-model="state.styles.bgColor" class="flex-1 bg-gray-800 border border-gray-600 rounded px-2 py-1.5 text-white text-xs focus:border-blue-500 focus:outline-none">
            </div>
          </div>
          <div class="pt-2 border-t border-gray-700">
            <label class="block text-gray-400 text-xs font-bold mb-2 uppercase">Taustakuva (JPG/PNG)</label>
            <div class="flex items-center gap-3">
              <input type="file" id="bgUploader" class="hidden" accept="image/*" @change="handleBgUpload">
              <label for="bgUploader" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 text-xs font-bold uppercase rounded border border-gray-500 text-white cursor-pointer transition shadow">
                <i class="fa-solid fa-image mr-1"></i> Lataa Kuva
              </label>
              <button v-if="state.styles.bgImage" @click="state.styles.bgImage = ''" class="bg-red-900/50 text-red-300 hover:bg-red-800 hover:text-white px-2 py-1 text-xs uppercase font-bold rounded border border-red-700 transition">
                <i class="fa-solid fa-trash mr-1"></i> Poista
              </button>
            </div>
            <p class="text-[10px] text-gray-400 mt-2 leading-tight">Lataa taustakuva suoraan editoriin, jotta se tallentuu projektiin koodattuna. Näin tuotettu HTML-tiedosto ei tarvitse erillisiä kuvatiedostoja toimiakseen.</p>
          </div>

          <!-- KORTTIEN ASETUKSET -->
          <div class="pt-2 border-t border-gray-700">
            <div class="flex items-center justify-between mb-3 mt-1">
              <label class="block text-gray-400 text-xs font-bold uppercase">Korttien sumennus (Blur)</label>
              <button @click="state.styles.cardBlur = !state.styles.cardBlur"
                      :class="state.styles.cardBlur ? 'bg-blue-600' : 'bg-gray-600'"
                      class="relative inline-flex h-5 w-10 shrink-0 cursor-pointer items-center rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
                <span :class="state.styles.cardBlur ? 'translate-x-5' : 'translate-x-0'" class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
              </button>
            </div>
            <label class="block text-gray-400 text-xs font-bold mb-2 uppercase flex justify-between">
              <span>Taustan läpinäkyvyys</span>
              <span class="text-blue-400">{{ Math.round(state.styles.cardBgAlpha * 100) }}%</span>
            </label>
            <input type="range" v-model.number="state.styles.cardBgAlpha" min="0" max="1" step="0.05" class="w-full cursor-pointer">
          </div>

        </div>
      </div>

      <!-- YLÄPALKKI -->
      <div v-if="activeTab === 'header'" class="space-y-4 animate-fade-in">
        <div>
          <label class="block text-gray-400 text-xs font-bold mb-1 uppercase">Pääotsikko</label>
          <input v-model="state.header.title" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-gray-400 text-xs font-bold mb-1 uppercase">Hinnat yläpalkissa</label>
          <div v-for="(p, i) in state.header.prices" :key="i" class="flex gap-2 mb-2">
            <input v-model="p.label" placeholder="Tyyppi (esim. norm)" class="flex-1 bg-gray-900 border border-gray-600 rounded px-2 py-1 focus:border-blue-500 focus:outline-none">
            <input v-model="p.value" placeholder="Hinta" class="w-20 bg-gray-900 border border-gray-600 rounded px-2 py-1 focus:border-blue-500 focus:outline-none">
            <button @click="state.header.prices.splice(i, 1)" class="bg-red-600/80 hover:bg-red-500 px-3 rounded"><i class="fa-solid fa-trash"></i></button>
          </div>
          <button @click="state.header.prices.push({label:'', value:''})" class="mt-1 bg-gray-700 hover:bg-gray-600 px-3 py-1.5 text-xs font-bold uppercase rounded w-full border border-gray-600">
            + Lisää Hinta
          </button>
        </div>
      </div>

      <!-- SARAKKEET JA KORTIT -->
      <div v-for="(col, colIndex) in state.columns" :key="'col-'+colIndex" v-show="activeTab === 'col'+colIndex" class="space-y-4 animate-fade-in">
        <div class="grid grid-cols-2 gap-3 mb-6 bg-gray-900 p-3 rounded border border-gray-700">
          <div>
            <label class="block text-gray-400 text-xs font-bold mb-1 uppercase">Sarakkeen Otsikko</label>
            <input v-model="col.title" class="w-full bg-gray-800 border border-gray-600 rounded px-2 py-1 text-white focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-gray-400 text-xs font-bold mb-1 uppercase">Alaotsikko</label>
            <input v-model="col.subtitle" placeholder="(esim. valitse 1-2)" class="w-full bg-gray-800 border border-gray-600 rounded px-2 py-1 text-white focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="space-y-4">
          <div v-for="(card, cardIndex) in col.cards" :key="cardIndex"
               class="bg-gray-700 p-3 rounded-md border border-gray-600 shadow-sm relative transition-all duration-200"
               @dragover.prevent
               @drop="onDrop($event, colIndex, cardIndex)">

            <div class="flex justify-between items-center mb-3 pb-2 border-b border-gray-600"
                 draggable="true"
                 @dragstart="onDragStart($event, colIndex, cardIndex)"
                 @dragend="onDragEnd">
              <span class="font-bold text-gray-300 cursor-move flex items-center gap-1 select-none" title="Raahaa järjestääksesi">
                <i class="fa-solid fa-grip-vertical text-gray-500 px-2 py-1 hover:text-white transition"></i> Osa
              </span>
              <div class="flex space-x-1">
                <button @click="moveCard(colIndex, cardIndex, -1)" class="bg-gray-600 hover:bg-gray-500 px-2 py-1 rounded" title="Siirrä ylös"><i class="fa-solid fa-arrow-up"></i></button>
                <button @click="moveCard(colIndex, cardIndex, 1)" class="bg-gray-600 hover:bg-gray-500 px-2 py-1 rounded" title="Siirrä alas"><i class="fa-solid fa-arrow-down"></i></button>
                <button @click="col.cards.splice(cardIndex, 1)" class="bg-red-600/80 hover:bg-red-500 px-2 py-1 rounded ml-2" title="Poista"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>

            <div class="space-y-3">
              <div class="flex gap-2">
                <div class="flex-1">
                  <label class="block text-gray-400 text-[10px] font-bold uppercase mb-0.5">Ruoan Nimi</label>
                  <input v-model="card.name" placeholder="Esim. Falafelit" class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1.5 focus:border-blue-500 focus:outline-none font-bold">
                </div>
                <div class="w-24">
                  <label class="block text-gray-400 text-[10px] font-bold uppercase mb-0.5">Hinta</label>
                  <input v-model="card.price" placeholder="+2€" class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1.5 focus:border-blue-500 focus:outline-none">
                </div>
              </div>

              <div>
                <label class="block text-gray-400 text-[10px] font-bold uppercase mb-0.5">Kuvaus</label>
                <input v-model="card.desc" placeholder="Ruoan lisäkuvaus" class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1.5 focus:border-blue-500 focus:outline-none">
              </div>

              <!-- ALLERGEENIT PILLERIT -->
              <div class="bg-gray-800 p-2 rounded border border-gray-700">
                <label class="block text-gray-400 text-[10px] font-bold uppercase mb-1">Allergeenit</label>
                <div class="flex flex-wrap gap-1 mb-2 min-h-[28px] bg-gray-900 p-1.5 rounded border border-gray-600">
                  <div v-for="(alg, idx) in card.allergens" :key="idx" class="flex items-center bg-gray-800 border border-gray-500 rounded overflow-hidden shadow-inner text-xs text-orange-300 font-semibold">
                    <span class="px-1.5 py-0.5">{{ alg }}</span>
                    <button @click="removeAllergen(card, idx)" class="px-1.5 py-0.5 text-gray-400 hover:text-red-400 hover:bg-gray-700 border-l border-gray-600"><i class="fa-solid fa-times"></i></button>
                  </div>
                  <span v-if="!card.allergens || card.allergens.length === 0" class="text-gray-500 text-[10px] px-1 py-0.5 uppercase tracking-wide">Ei allergeeneja</span>
                </div>
                <div class="flex gap-1">
                  <select v-model="card.newAllergen" class="flex-1 bg-gray-900 border border-gray-600 rounded px-1 py-1.5 text-xs focus:border-blue-500 focus:outline-none text-white cursor-pointer">
                    <option value="">- Valitse lisättävä -</option>
                    <option v-for="opt in allergenOptions" :key="opt" :value="opt">{{ opt }}</option>
                    <option value="custom">Muu (kirjoita)...</option>
                  </select>
                  <input v-if="card.newAllergen === 'custom'" v-model="card.customAllergen" placeholder="Muu..." class="w-24 bg-gray-900 border border-gray-600 rounded px-1.5 py-1.5 text-xs focus:border-blue-500 focus:outline-none text-orange-300">
                  <button @click="addAllergen(card)" class="bg-gray-600 hover:bg-gray-500 px-3 rounded text-xs text-white border border-gray-500 font-bold transition"><i class="fa-solid fa-plus"></i></button>
                </div>
              </div>

              <!-- PILLERIT JA KUVA E-MENUUN -->
              <div class="bg-gray-800 p-2 rounded border border-gray-700">
                <label class="block text-gray-400 text-[10px] font-bold uppercase mb-1">Raaka-aineet</label>
                <div class="flex flex-wrap gap-1.5 mb-2">
                  <div v-for="(pill, pIdx) in card.pills" :key="pIdx" class="flex items-center bg-gray-900 border border-gray-600 rounded overflow-hidden shadow-inner">
                    <input v-model="pill.name" placeholder="Raaka-aine" class="w-24 sm:w-28 bg-transparent text-xs px-2 py-1 outline-none text-white focus:bg-gray-700">
                    <button @click="card.pills.splice(pIdx, 1)" class="px-2 h-full text-gray-400 hover:text-red-400 hover:bg-gray-700 border-l border-gray-700"><i class="fa-solid fa-times"></i></button>
                  </div>
                </div>
                <button @click="card.pills.push({name: ''})" class="text-[10px] bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-white uppercase font-bold tracking-wide w-full border border-gray-600 mb-2">
                  + Lisää raaka-aine
                </button>

                <div class="border-t border-gray-700 pt-2 flex items-center justify-between">
                  <label class="block text-gray-400 text-[10px] font-bold uppercase">Kuva (E-Menu)</label>
                  <div class="flex items-center gap-2">
                    <img v-if="card.image" :src="card.image" class="h-8 w-8 object-cover rounded border border-gray-500 cursor-pointer" @click="document.getElementById('file-'+colIndex+'-'+cardIndex).click()">
                    <button v-if="card.image" @click="card.image = ''" class="text-gray-400 hover:text-red-400" title="Poista kuva"><i class="fa-solid fa-trash"></i></button>
                    <input :id="'file-'+colIndex+'-'+cardIndex" type="file" class="hidden" accept="image/*" @change="e => handleImageUpload(e, card)">
                    <label v-if="!card.image" :for="'file-'+colIndex+'-'+cardIndex" class="cursor-pointer bg-gray-700 hover:bg-gray-600 px-2 py-1 text-[10px] uppercase font-bold rounded border border-gray-500 text-white">
                      <i class="fa-solid fa-camera mr-1"></i> Lisää kuva
                    </label>
                  </div>
                </div>
              </div>

            </div>
          </div>

          <button @click="addCard(colIndex)" class="w-full py-2 bg-gray-700 hover:bg-gray-600 border border-gray-500 border-dashed rounded text-gray-300 font-bold uppercase text-xs transition">
            <i class="fa-solid fa-plus mr-1"></i> Lisää Uusi Osa
          </button>
        </div>
      </div>

      <!-- ALAPALKKI (TOPPINGS) -->
      <div v-if="activeTab === 'footer'" class="space-y-4 animate-fade-in">
        <div>
          <label class="block text-gray-400 text-xs font-bold mb-1 uppercase">Topping Otsikko</label>
          <input v-model="state.footer.title" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-gray-400 text-xs font-bold mb-1 uppercase">Toppings / Extrat</label>

          <div v-for="(t, i) in state.footer.toppings" :key="i" class="flex flex-col gap-2 mb-3 p-2 bg-gray-800 border border-gray-700 rounded items-start shadow-sm">
            <div class="flex gap-2 w-full">
              <input v-model="t.name" placeholder="Täytteen Nimi" class="flex-1 bg-gray-900 border border-gray-600 rounded px-2 py-1.5 font-bold focus:border-blue-500 focus:outline-none">
              <button @click="state.footer.toppings.splice(i, 1)" class="bg-red-600/80 hover:bg-red-500 px-3 py-1.5 rounded"><i class="fa-solid fa-trash"></i></button>
            </div>

            <div class="w-full border-t border-gray-700 pt-2">
              <label class="block text-gray-400 text-[10px] font-bold uppercase mb-1">Allergeenit</label>
              <div class="flex flex-wrap gap-1 mb-2 min-h-[28px] bg-gray-900 p-1.5 rounded border border-gray-600">
                <div v-for="(alg, idx) in t.allergens" :key="idx" class="flex items-center bg-gray-800 border border-gray-500 rounded overflow-hidden shadow-inner text-xs text-orange-300 font-semibold">
                  <span class="px-1.5 py-0.5">{{ alg }}</span>
                  <button @click="removeAllergen(t, idx)" class="px-1.5 py-0.5 text-gray-400 hover:text-red-400 hover:bg-gray-700 border-l border-gray-600"><i class="fa-solid fa-times"></i></button>
                </div>
                <span v-if="!t.allergens || t.allergens.length === 0" class="text-gray-500 text-[10px] px-1 py-0.5 uppercase tracking-wide">Ei allergeeneja</span>
              </div>
              <div class="flex gap-1">
                <select v-model="t.newAllergen" class="flex-1 bg-gray-900 border border-gray-600 rounded px-1 py-1.5 text-xs focus:border-blue-500 focus:outline-none text-white cursor-pointer">
                  <option value="">- Valitse lisättävä -</option>
                  <option v-for="opt in allergenOptions" :key="opt" :value="opt">{{ opt }}</option>
                  <option value="custom">Muu...</option>
                </select>
                <input v-if="t.newAllergen === 'custom'" v-model="t.customAllergen" placeholder="Muu..." class="w-24 bg-gray-900 border border-gray-600 rounded px-1.5 py-1.5 text-xs focus:border-blue-500 focus:outline-none text-orange-300">
                <button @click="addAllergen(t)" class="bg-gray-600 hover:bg-gray-500 px-3 rounded text-xs text-white border border-gray-500 font-bold transition"><i class="fa-solid fa-plus"></i></button>
              </div>
            </div>
          </div>

          <button @click="state.footer.toppings.push({name:'', allergen:'', allergens:[], newAllergen:'', customAllergen:''})" class="mt-2 bg-gray-700 hover:bg-gray-600 px-3 py-2 text-xs font-bold uppercase rounded w-full border border-gray-500 border-dashed text-gray-300 transition">
            <i class="fa-solid fa-plus mr-1"></i> Lisää Topping
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- OIKEA PANEELI: LIVE PREVIEW & PANNING CANVAS -->
  <div class="w-full h-[25vh] md:h-full md:flex-1 bg-gray-950 relative overflow-hidden outline-none border-b md:border-b-0 md:border-l border-gray-700"
       ref="viewportRef"
       :class="isDragging ? 'cursor-grabbing' : 'cursor-grab'"
       @mousedown.prevent="startDrag"
       @mousemove="doDrag"
       @mouseup="stopDrag"
       @mouseleave="stopDrag"
       @wheel.prevent="handleWheel"
       @touchstart.prevent="startDragTouch"
       @touchmove.prevent="doDragTouch"
       @touchend="stopDrag">

    <!-- Työkalut alakulmassa (Keskitä) -->
    <div class="absolute bottom-4 right-4 md:bottom-6 md:right-6 z-20">
       <button @click="resetView" class="bg-gray-800 text-white p-2 px-4 rounded-lg hover:bg-gray-700 font-bold text-xs uppercase shadow-xl border border-gray-700" title="Palauta näkymä">Keskitä</button>
    </div>

    <!-- PANNING WRAPPER (Origin top-left) -->
    <div class="absolute top-0 left-0 will-change-transform"
         :style="{ transform: `translate(${panX}px, ${panY}px) scale(${zoom})`, transformOrigin: '0 0' }">

      <!-- 1920x1080 KIINTEÄ IFRAME. -->
      <div class="w-[1920px] h-[1080px] bg-white relative shadow-[0_0_80px_rgba(0,0,0,0.6)] ring-1 ring-gray-700 overflow-hidden pointer-events-none">
        <iframe :srcdoc="generatedHtml" class="w-full h-full border-none pointer-events-none"></iframe>
      </div>

    </div>
  </div>
</div>

<script>
const { createApp, reactive, computed, ref, onMounted } = Vue;

createApp({
  setup() {
    const activeTab = ref('styles');
    const fileInput = ref(null);
    const viewportRef = ref(null);

    // Kaikki käytössä olevat allergeenit pudotusvalikkoon
    const allergenOptions = [
      'G', 'L', 'M', 'VL', 'VEG',
      '(sis. maito)', '(sis. gluteeni)', '(sis. kananmuna)',

      reader.onload = (event) => {

        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600;
          const MAX_HEIGHT = 600;
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          } else {
            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          card.image = canvas.toDataURL('image/jpeg', 0.85); // Pienennetty kuva e-menuun

    const getDistance = (touches) => {
      return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);

      if (!isDragging.value) return;
      panX.value = initialPanX + (e.clientX - startMouseX);

    const startDragTouch = (e) => {
      if(e.touches.length === 1) {
        isDragging.value = true;
        startMouseX = e.touches[0].clientX;
        startMouseY = e.touches[0].clientY;
        initialPanX = panX.value;
        initialPanY = panY.value;
      } else if (e.touches.length === 2) {
        isDragging.value = false; // Peruutetaan yhden sormen siirto jos pinch
        lastPinchDist = getDistance(e.touches);
        if (viewportRef.value) {
          const rect = viewportRef.value.getBoundingClientRect();
          lastPinchCenterX = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
          lastPinchCenterY = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
        }
      }
    };

    const doDragTouch = (e) => {
      if (e.touches.length === 1 && isDragging.value) {
        panX.value = initialPanX + (e.touches[0].clientX - startMouseX);
        panY.value = initialPanY + (e.touches[0].clientY - startMouseY);
      } else if (e.touches.length === 2 && lastPinchDist && viewportRef.value) {
        const dist = getDistance(e.touches);
        const factor = dist / lastPinchDist;
        const oldZoom = zoom.value;
        const newZoom = Math.max(0.1, Math.min(oldZoom * factor, 3));

        const canvasX = (lastPinchCenterX - panX.value) / oldZoom;
        const canvasY = (lastPinchCenterY - panY.value) / oldZoom;

        zoom.value = newZoom;
        panX.value = lastPinchCenterX - canvasX * newZoom;
        panY.value = lastPinchCenterY - canvasY * newZoom;
        lastPinchDist = dist;

        const rect = viewportRef.value.getBoundingClientRect();
        const newCenterX = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
        const newCenterY = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;

        panX.value += (newCenterX - lastPinchCenterX);
        panY.value += (newCenterY - lastPinchCenterY);
        lastPinchCenterX = newCenterX;
        lastPinchCenterY = newCenterY;

      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const oldZoom = zoom.value;
      const factor = e.deltaY > 0 ? 0.9 : 1.1;
      const newZoom = Math.max(0.1, Math.min(oldZoom * factor, 3));

      const canvasX = (mouseX - panX.value) / oldZoom;
      const canvasY = (mouseY - panY.value) / oldZoom;

      zoom.value = newZoom;
      panX.value = mouseX - canvasX * newZoom;
      panY.value = mouseY - canvasY * newZoom;
    };

      const scaleX = (rect.width - 40) / canvasW;
      const scaleY = (rect.height - 40) / canvasH;
      const newZoom = Math.min(scaleX, scaleY, 1);
      zoom.value = newZoom;
      panX.value = (rect.width - canvasW * newZoom) / 2;

          }
        } catch (err) {
          alert("Tiedoston lukeminen epäonnistui. Varmista että se on editorin generoima tiedosto.\nVirhe: " + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    };

    const googleFontsUrl = computed(() => {
      const hFont = state.styles.fontHeading.replace(/ /g, '+');
      const bFont = state.styles.fontBody.replace(/ /g, '+');
      const families = Array.from(new Set([hFont, bFont]));
      const familyParams = families.map(f => `family=${f}:ital,wght@0,400;0,700;1,400;1,700`).join('&');
      return `https://fonts.googleapis.com/css2?${familyParams}&display=swap`;
    });

    const generatedHtml = computed(() => {
      // Varmistaa että Vue jäljittää ja päivittää kun stylet muuttuvat
      JSON.stringify(state.styles);

      try {
        if (typeof window.generatePreviewHtml === 'function') {
          return window.generatePreviewHtml(state, escape, googleFontsUrl.value);
        }
        return `
          <html style="background:#111827; color:white; font-family:sans-serif; text-align:center; padding-top:20vh;">
            <body>
              <h2 style="color:#ef4444; font-size:24px; margin-bottom:20px;">Tiedostoa ei löytynyt!</h2>
              <p>Editori ei pysty generoimaan esikatselua, koska <b>generate_preview.js</b> -tiedostoa ei ladattu oikein.</p>
              <p>Varmista, että kyseinen tiedosto löytyy samasta kansiosta täsmälleen tällä nimellä.</p>
            </body>
          </html>`;
      } catch (err) {
        return `<html><body><h2 style="color:red;">Virhe esikatselussa:</h2><pre>${err.message}</pre></body></html>`;
      }
    });

    const generatedEMenuHtml = computed(() => {
      // Varmistaa että Vue jäljittää ja päivittää myös e-menun taustalla
      JSON.stringify(state.styles);

      try {
        if (typeof window.generateEMenuHtml === 'function') {
          return window.generateEMenuHtml(state, escape, googleFontsUrl.value);
        }
        return '';
      } catch (err) {
        console.error(err);
        return '';
      }
    });

    const exportHtml = () => {
      const blobMenu = new Blob([generatedHtml.value], { type: 'text/html' });
      const linkMenu = document.createElement('a');
      linkMenu.href = URL.createObjectURL(blobMenu);
      linkMenu.download = 'menu.html';
      linkMenu.click();
      URL.revokeObjectURL(linkMenu.href);

      setTimeout(() => {
        const blobEMenu = new Blob([generatedEMenuHtml.value], { type: 'text/html' });
        const linkEMenu = document.createElement('a');
        linkEMenu.href = URL.createObjectURL(blobEMenu);
        linkEMenu.download = 'e-menu.html';
        linkEMenu.click();
        URL.revokeObjectURL(linkEMenu.href);
      }, 500);
    };

    return {
      state, activeTab, tabClass, addCard, moveCard, clearMenu, generatedHtml, exportHtml, importHtml, fileInput,
      allergenOptions, addAllergen, removeAllergen, handleImageUpload, handleBgUpload, viewportRef,
      onDragStart, onDragEnd, onDrop, isDragging,
      panX, panY, zoom, startDrag, doDrag, stopDrag, handleWheel, startDragTouch, doDragTouch, resetView
    };
  }
}).mount('#app');
</script>
</body>
</html>
